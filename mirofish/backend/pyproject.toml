[project]
name = "mirofish-backend"
version = "0.1.0"
description = "MiroFish - 简洁通用的群体智能引擎，预测万物"
requires-python = ">=3.11,<3.13"
license = { text = "AGPL-3.0" }
authors = [
    { name = "MiroFish Team" }
]

dependencies = [
    # 核心框架
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    
    # LLM 相关
    "openai>=1.0.0",
    
    # Zep Cloud
    "zep-cloud==3.25.0",
    "httpx>=0.27.0",
    
    # OASIS 社交媒体模拟
    # NOTE: the OASIS simulation scripts live in mirofish/simulations/ with
    # their own dependency tree (camel-oasis pins carry unfixable CVEs, see
    # Dependabot #189/#150). The backend must not depend on them; the
    # SimulationRunner launches the scripts via the simulations venv.
    
    # 文件处理
    "PyMuPDF>=1.24.0",
    # 编码检测（支持非UTF-8编码的文本文件）
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    
    # 工具库
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    # Security floor: GHSA-ffc3-869f-jxw9 (critical, asymmetric-PEM detection
    # bypass) and related PyJWT CVEs are fixed in 2.14.0. Pinned here so a
    # future `uv lock` cannot silently downgrade the transitive pin.
    "PyJWT>=2.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pipreqs>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
