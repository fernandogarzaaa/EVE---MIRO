[project]
name = "eve-miro"
version = "0.1.0"
description = "EVE-MIRO — Reality-Grounded Experiential Simulation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "EVE-MIRO contributors" }]
keywords = ["simulation", "provenance", "world-state", "evaluation"]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
  "pyyaml>=6.0,<7",
  "python-dotenv>=1.0,<2",
  "polars>=1.9,<2",
  "duckdb>=1.1,<2",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
]

[project.scripts]
eve-miro = "eve_miro.api.main:run"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eve_miro = ["api/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py312"
