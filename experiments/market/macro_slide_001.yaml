# macro_slide_001: news-driven multi-day slide, escalating waves.
#
# Source event: S&P 500 (SPY), 2025-04-03/04. Tariff announcement
# ("Liberation Day", 2025-04-02): SPY -4.93% on 04-03 (abnormal z -4.13,
# volume 1.8x) then -5.85% on 04-04 (z -4.19, volume 2.8x), two-day
# cumulative -10.49%. The second wave was worse than the first.
# Recovery followed: +5d +5.67% from the 04-04 close. Statistics measured
# from the Signal Lab price store with the analogues event-detection
# pipeline.
#
# Template structure: two escalating liquidation waves 24h apart plus a
# mild permanent growth impairment (tariffs as a tax on earnings).
# Unlike the single-session shocks, pressure persists across sessions and
# the path grinds lower without a V-recovery inside the horizon.
# The simulated magnitude is the engine's response at these parameters,
# NOT a replay of the -10.49% two-day slide.
#
# SIMULATED. Stress-test template shaped like a past shock, not a replay
# and not a prediction. Agent-based scenario projection under stated
# assumptions, never a forecast of market prices.
name: market_macro_slide_001
type: market
disclaimer: >-
  SIMULATED. Agent-based scenario projection under stated assumptions,
  not a forecast of market prices. Macro news-driven multi-day slide,
  shaped like SPY 2025-04-03/04 (tariff shock): two escalating
  liquidation waves with mild lasting impairment, no V-recovery.
initial_world:
  source: world_state
  timestamp: "2024-11-04T00:00:00Z"
  region: global
duration:
  simulated_hours: 120
agents:
  population: 60
conditions:
  symbols:
    - ACME
  initial_prices:
    ACME: 100.0
  agent_mix:
    market_maker: 0.10
    momentum: 0.30
    noise: 0.40
    fundamental: 0.20
interventions:
  - type: sell_shock
    timestamp: "+6h"
    extra:
      symbol: ACME
      quantity: 36000.0
      duration_hours: 12
  - type: sell_shock
    timestamp: "+30h"
    extra:
      symbol: ACME
      quantity: 36000.0
      duration_hours: 12
  - type: rate_shock
    timestamp: "+6h"
    extra:
      fair_value_pct_change: -0.08
      symbols:
        - ACME
random_seed: 202411
information_cutoff: "2024-11-04T00:00:00Z"
