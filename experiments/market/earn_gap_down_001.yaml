# dividend suspended. Next session close-to-close -26.06%, abnormal z -6.60
# vs trailing 60d, volume 4.1x the 20d average. No snapback: +1d -6.38%,
# +5d -8.24% (kept drifting). Statistics measured from the Signal Lab price
# store with the analogues event-detection pipeline; event identity
# cross-checked against contemporaneous reporting.
#
# Template structure: an overnight gap (single market sell at the open),
# sustained liquidation pressure through the session and beyond, and a
# permanent fair-value impairment (the guidance/dividend cut reprices what
# fundamentals will pay). The simulated magnitude is the engine's response
# at these parameters, NOT a replay of -26.06%.
#
# SIMULATED. Stress-test template shaped like a past shock, not a replay
# and not a prediction. Agent-based scenario projection under stated
# assumptions, never a forecast of market prices.
