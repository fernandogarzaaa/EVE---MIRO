name: release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - name: Checksums
        run: |
          sha256sum install.sh install.ps1 dist/* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
            install.sh
            install.ps1
            SHA256SUMS.txt
