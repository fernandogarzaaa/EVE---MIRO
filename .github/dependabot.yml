      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "npm"
    directory: "/mirofish"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "npm"
    directory: "/mirofish/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
