# EVE-MIRO local stack. No Kubernetes.
# Default `docker compose up` starts postgres (PostGIS), redis, minio, api.
# Optional:
#   docker compose --profile streaming up     # Redpanda
#   docker compose --profile timeseries up    # same PostGIS postgres; Timescale is future
#   docker compose --profile engines up       # in-tree MiroFish + EVE images
#
# MinIO bucket (eve-miro) prefixes:
#   raw/  normalized/  derived/  simulation/  experiments/

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: eve
      POSTGRES_PASSWORD: eve
      POSTGRES_DB: eve_miro
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eve -d eve_miro"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  api:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://eve:eve@postgres:5432/eve_miro
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_BUCKET: eve-miro
      FIXTURES: "1"
      EVE_MIRO_ENGINES: ${EVE_MIRO_ENGINES:-stub}
      MIROFISH_ROOT: ${MIROFISH_ROOT:-./mirofish}
      EVE_ROOT: ${EVE_ROOT:-./eve}
      # Optional local service override when --profile engines is up:
      # MIROFISH_URL: http://mirofish:5001
      MIROFISH_URL: ${MIROFISH_URL:-}
      EVE_URL: ${EVE_URL:-}
      EVE_BIN: ${EVE_BIN:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  # --profile streaming
  redpanda:
    profiles: ["streaming"]
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 512M
      - --overprovisioned
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644"

  # --profile timeseries
  # Time series stay on the same PostGIS postgres service. Do not replace
  # postgis/postgis:16-3.4 with Timescale — hypertables would fight geography.
  # Timescale is a future option on a separate DSN, not this image.
  timeseries:
    profiles: ["timeseries"]
    image: alpine:3.20
    depends_on:
      postgres:
        condition: service_healthy
    command: ["echo", "Timescale is future. Time series live on PostGIS postgres. Do not replace postgis/postgis:16-3.4."]
    restart: "no"


  # --profile engines
  # In-tree MiroFish (HTTP 5001 + frontend 3000). Needs LLM keys in the
  # environment or mirofish/.env; otherwise the process will refuse to start.
  # Alternative: cd mirofish && docker compose up
  mirofish:
    profiles: ["engines"]
    build:
      context: ./mirofish
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
      - "5001:5001"
    environment:
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: "5001"
      LLM_API_KEY: ${LLM_API_KEY:-}
      ZEP_API_KEY: ${ZEP_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-}

  # In-tree EVE. CLI-only (entrypoint `eve`, no HTTP). Example:
  #   docker compose --profile engines run --rm eve --help
  # Adapters default EVE_BIN to the in-tree CLI; the API does not require
  # this service on default `up`.
  eve:
    profiles: ["engines"]
    build:
      context: ./eve
      dockerfile: Dockerfile
    stdin_open: true
    tty: true

volumes:
  pgdata:
  miniodata:
