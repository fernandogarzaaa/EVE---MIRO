# Market closed-loop experiment: marketsim engine, t1 market.bar alignment.
#
# SIMULATED. Scenario projections under stated assumptions, never price
# forecasts. Used by the Phase 3 alignment wiring test and as a template
# for real market closed-loop runs.
experiment:
  id: market_closed_loop_001
  observation:
    location: global
    information_cutoff: "2024-11-04T00:00:00Z"
  initialization:
    world_state: observed
  simulation:
    engine: marketsim
    agents: 12
    horizon: 12h
    seeds: [7, 8]
  experience:
    engine: eve
    validate: false
    counterfactuals: false
  scenarios:
    - id: sell_shock_001
  evaluation:
    reality_source: observed
    metrics: [mae]
